<script>
(() => {
'use strict';

/* =========================================================
   QUACK — a Doom/Quake-style shooter where every enemy is a
   duck and your only weapon is bread. Feed them until they
   are satisfied and fly away. Find the keycard, reach the exit.
   ========================================================= */

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const ov = document.getElementById('touch'), octx = ov.getContext('2d');

const H = 200, VIEW_H = 168, BAR_H = 32, HORIZON = VIEW_H / 2, PLANE = 0.66, TEX = 64;
const FONT = '"Press Start 2P", monospace';
let W = 320, projDist = W / 2 / PLANE, zbuf = new Float32Array(W);
let ceilGrad, floorGrad;

const rand = Math.random;
const rint = (a, b) => a + Math.floor(rand() * (b - a + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = arr => arr[Math.floor(rand() * arr.length)];
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ell(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }

/* ---------------- Storage ---------------- */
let best = 1;
try { best = parseInt(localStorage.getItem('quack.best') || '1', 10) || 1; } catch (e) {}
function saveBest(lv) { if (lv > best) { best = lv; try { localStorage.setItem('quack.best', String(best)); } catch (e) {} } }

/* ---------------- Sound (procedural WebAudio) ---------------- */
let AC = null, master = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone({ type = 'square', f0 = 440, f1 = f0, dur = 0.1, vol = 0.2, filt = 0, q = 1, delay = 0 }) {
  if (!AC || vol < 0.003) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let n = o;
  if (filt) { const bf = AC.createBiquadFilter(); bf.type = 'bandpass'; bf.frequency.value = filt; bf.Q.value = q; o.connect(bf); n = bf; }
  n.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.03);
}
let noiseBuf = null;
function noise(dur, vol, ftype, freq, delay = 0) {
  if (!AC) return;

    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  quack(p = 1, v = 0.22) {
    tone({ type: 'sawtooth', f0: 560 * p, f1: 320 * p, dur: 0.12, vol: v, filt: 1300 * p, q: 4 });
    tone({ type: 'sawtooth', f0: 600 * p, f1: 290 * p, dur: 0.17, vol: v, filt: 1150 * p, q: 4, delay: 0.14 });
  },
  honk(v = 0.22) {
    tone({ type: 'square', f0: 340, f1: 255, dur: 0.3, vol: v, filt: 650, q: 2 });
    tone({ type: 'sawtooth', f0: 346, f1: 262, dur: 0.3, vol: v * 0.6, filt: 900, q: 3 });
  },
  call(type, v) { if (type === 'goose') sfx.honk(v); else if (type === 'muscovy') sfx.hiss(v); else sfx.quack(DUCKS[type].pitch, v); },
  hiss(v = 0.2) { noise(0.45, v, 'bandpass', 3200); tone({ type: 'sawtooth', f0: 140, f1: 90, dur: 0.4, vol: v * 0.3, filt: 400 }); },
  fwip(v = 0.15) { noise(0.09, v, 'highpass', 3000); tone({ type: 'triangle', f0: 1400, f1: 500, dur: 0.1, vol: v * 0.5 }); },
  throw() { noise(0.12, 0.18, 'highpass', 2200); },
  nom() { for (let i = 0; i < 3; i++) noise(0.05, 0.22, 'lowpass', 800 + i * 150, i * 0.07); },
  happy(type) {
    sfx.call(type, 0.25);
    tone({ type: 'triangle', f0: 880, f1: 1760, dur: 0.25, vol: 0.15, delay: 0.32 });
  },
  pickup() { tone({ type: 'triangle', f0: 660, dur: 0.08, vol: 0.2 }); tone({ type: 'triangle', f0: 990, dur: 0.1, vol: 0.2, delay: 0.08 }); },
  key() { [523, 659, 784, 1046].forEach((f, i) => tone({ type: 'square', f0: f, dur: 0.1, vol: 0.12, delay: i * 0.08 })); },
  hurt() { tone({ type: 'sawtooth', f0: 170, f1: 60, dur: 0.25, vol: 0.3, filt: 420, q: 1 }); noise(0.08, 0.15, 'lowpass', 600); },
  locked() { tone({ type: 'square', f0: 130, f1: 110, dur: 0.18, vol: 0.18 }); tone({ type: 'square', f0: 110, f1: 95, dur: 0.18, vol: 0.18, delay: 0.2 }); },
  exit() { [392, 523, 659, 784, 1046].forEach((f, i) => tone({ type: 'triangle', f0: f, dur: 0.14, vol: 0.18, delay: i * 0.1 })); },
  click() { tone({ type: 'square', f0: 220, dur: 0.04, vol: 0.08 }); },
  splash() { noise(0.18, 0.12, 'lowpass', 1200); },
  die() { tone({ type: 'sawtooth', f0: 300, f1: 40, dur: 1.2, vol: 0.3, filt: 500 }); }
};

/* ---------------- Music: "Breadline Thrash" ----------------
   An original chiptune thrash loop played live by a tiny step sequencer:
   distorted square-wave power chords, palm-muted E chugs, a gallop section,
   a squealing square lead, and drums. Toggle with N (or the music button). */
const BPM = 168, SPB = 60 / BPM / 4; // seconds per 16th note
// guitar steps: number = power chord that many semitones above low E, 'x' = palm-muted low E chug, null = rest
const RIFF_A = ['x', 'x', 0, null, 'x', 'x', 3, null, 'x', 'x', 5, null, 'x', 6, 5, 3,
                'x', 'x', 0, null, 'x', 'x', 7, null, 'x', 'x', 8, 7, 5, 3, 1, null];
const RIFF_B = [0, null, 0, 0, 0, null, 0, 0, 1, null, 1, 1, 1, null, 1, 1,
                3, null, 3, 3, 5, null, 5, 5, 6, null, 6, 6, 7, null, 8, 7];
const LEAD_C = [24, null, null, 22, null, null, 19, null, 20, null, 19, 17, null, null, 15, null,
                24, null, 27, null, 26, null, 24, null, 22, null, 20, 19, 17, null, null, null];
const FORM = ['C', 'A', 'B', 'C', 'A', 'B']; // opens on the lead so it's audible from the first second
const SONG_STEPS = FORM.length * 32;
const music = { on: true, playing: false, step: 0, next: 0, timer: null, nodes: null };
try { music.on = localStorage.getItem('quack.music') !== 'off'; } catch (e) {}
const noiseFor = new WeakMap();
function noiseBuffer(ctx) {

  return b;

function musicNodes(ctx, out) {
  const bus = ctx.createGain(); bus.gain.value = 0.17;          // reasonable, low background level
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
  bus.connect(comp); comp.connect(out);
  const shaper = ctx.createWaveShaper(); const n = 1024, curve = new Float32Array(n), k = 30;
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; curve[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
  shaper.curve = curve;
  const cab = ctx.createBiquadFilter(); cab.type = 'lowpass'; cab.frequency.value = 3200;
  const gtrOut = ctx.createGain(); gtrOut.gain.value = 0.32;
  shaper.connect(cab); cab.connect(gtrOut); gtrOut.connect(bus);

function env(g, t, a, peak, dur) {
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(peak * 0.6, t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function osc(ctx, type, f, t, dur, dest, detune = 0) {
  const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.detune.value = detune;
  o.connect(dest); o.start(t); o.stop(t + dur + 0.02); return o;
}
function guitar(N, semi, t, dur, mute) {
  const ctx = N.ctx, f = 82.41 * Math.pow(2, semi / 12);
  const g = ctx.createGain(); env(g, t, 0.004, mute ? 0.9 : 0.7, dur);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = mute ? 1400 : 2800;
  g.connect(lp); lp.connect(N.shaper);
  osc(ctx, 'square', f, t, dur, g, -7); osc(ctx, 'square', f, t, dur, g, 7);  // root, double-tracked
  osc(ctx, 'square', f * 1.5, t, dur, g); if (!mute) osc(ctx, 'square', f * 2, t, dur, g); // fifth + octave
  // clean chiptune layer two octaves up so the riff cuts through small phone/laptop speakers
  const cg = ctx.createGain(); env(cg, t, 0.003, mute ? 0.15 : 0.18, dur * (mute ? 1 : 0.8)); cg.connect(N.bus);
  osc(ctx, 'square', f * 4, t, dur, cg); osc(ctx, 'square', f * 6, t, dur, cg);
}
function bass(N, semi, t, dur) {
  const ctx = N.ctx, g = ctx.createGain(); env(g, t, 0.004, 0.32, dur); g.connect(N.bus);
  osc(ctx, 'triangle', 41.2 * Math.pow(2, semi / 12), t, dur, g);
}
function lead(N, semi, t, dur) {
  const ctx = N.ctx, g = ctx.createGain(); env(g, t, 0.01, 0.2, dur); g.connect(N.bus);
  const f = 164.8 * Math.pow(2, semi / 12);
  const o = osc(ctx, 'square', f, t, dur, g);
  const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 6; lg.gain.value = f * 0.012; // vibrato
  lfo.connect(lg); lg.connect(o.frequency); lfo.start(t + 0.08); lfo.stop(t + dur);
}
function drum(N, kind, t) {
  const ctx = N.ctx;
  if (kind === 'k') {
    const g = ctx.createGain(); g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14); g.connect(N.bus);
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    o.connect(g); o.start(t); o.stop(t + 0.16);
  } else {
    const s = ctx.createBufferSource(); s.buffer = noiseBuffer(ctx);
    const f = ctx.createBiquadFilter(), g = ctx.createGain();
    const snare = kind === 's', crash = kind === 'c';
    f.type = snare ? 'bandpass' : 'highpass'; f.frequency.value = snare ? 1800 : crash ? 5000 : 8000;
    const len = snare ? 0.16 : crash ? 0.9 : 0.04, vol = snare ? 0.55 : crash ? 0.25 : 0.18;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    s.connect(f); f.connect(g); g.connect(N.bus); s.start(t); s.stop(t + len + 0.02);
    if (snare) { const tg = ctx.createGain(); env(tg, t, 0.002, 0.3, 0.08); tg.connect(N.bus); osc(ctx, 'triangle', 190, t, 0.08, tg); }
  }
}
function playStep(N, step, t) {
  const part = FORM[Math.floor(step / 32) % FORM.length], s = step % 32;
  const riff = part === 'B' ? RIFF_B : RIFF_A, n = riff[s];
  if (n === 'x') { guitar(N, 0, t, SPB * 0.85, true); bass(N, 0, t, SPB * 0.85); }
  else if (n !== null) { guitar(N, n, t, SPB * 1.7, false); bass(N, n, t, SPB * 1.7); }
  if (part === 'B') { // thrash skank beat: kick on the beat, snare on the off-beat
    if (s % 4 === 0) drum(N, 'k', t);
    if (s % 4 === 2) drum(N, 's', t);
    if (s % 2 === 1) drum(N, 'h', t);
  } else {
    if (n === 'x' || s % 4 === 0) drum(N, 'k', t);
    if (s % 8 === 4) drum(N, 's', t);
    if (s % 2 === 0) drum(N, 'h', t);
  }
  if (s === 0 && (part === 'C' || step === 0)) drum(N, 'c', t);
  if (part === 'C' && LEAD_C[s] !== null) lead(N, LEAD_C[s], t, SPB * 2.6);
}
function musicTick() {
  if (!AC || !music.playing) return;
  const now = AC.currentTime;
  if (music.next < now - 0.2) music.next = now + 0.05; // tab was asleep: skip ahead instead of bursting
  while (music.next < now + 0.15) {
    playStep(music.nodes, music.step, music.next);
    music.next += SPB; music.step = (music.step + 1) % SONG_STEPS;
  }
}
function musicStart(restart) {
  if (!AC || !music.on || (music.playing && !restart)) return;
  if (!music.nodes || music.nodes.ctx !== AC) music.nodes = musicNodes(AC, master);
  clearInterval(music.timer);
  music.playing = true; music.step = 0; music.next = AC.currentTime + 0.05;
  music.timer = setInterval(musicTick, 30); musicTick();
}
function musicStop() { music.playing = false; clearInterval(music.timer); }
function toggleMusic() {
  music.on = !music.on;
  try { localStorage.setItem('quack.music', music.on ? 'on' : 'off'); } catch (e) {}
  if (music.on) { audio(); musicStart(); } else musicStop();
  msg(music.on ? 'MUSIC ON' : 'MUSIC OFF', 1.5);
}
// renders the loop offline (used to make a preview file of the song)
async function renderMusic(sec) {
  const off = new OfflineAudioContext(1, Math.round(44100 * sec), 44100);
  const out = off.createGain(); out.gain.value = 0.5 * 2.6; out.connect(off.destination); // preview at a listenable level
  const N = musicNodes(off, out);
  for (let st = 0, t = 0.05; t < sec - 0.2; st++, t += SPB) playStep(N, st % SONG_STEPS, t);
  const buf = await off.startRendering(), d = buf.getChannelData(0);
  const pcm = new Int16Array(d.length); for (let i = 0; i < d.length; i++) pcm[i] = Math.max(-1, Math.min(1, d[i])) * 32767;
  let bin = ''; const u8 = new Uint8Array(pcm.buffer); for (let i = 0; i < u8.length; i += 8192) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 8192));

/* ---------------- Wall textures ---------------- */
function pixTex(fn) {
  const c = mkCanvas(TEX, TEX), g = c.getContext('2d'), img = g.createImageData(TEX, TEX), d = img.data;
  for (let y = 0; y < TEX; y++) for (let x = 0; x < TEX; x++) {
    const [r, gg, b] = fn(x, y), i = (y * TEX + x) * 4;
    d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0); return c;
}
const tex = {};
/* smooth tileable value noise (period 64px) for organic park textures */
function vnoise(x, y, s, seed) {
  const g = (ix, iy) => { ix = ((ix % s) + s) % s; iy = ((iy % s) + s) % s; const h = Math.sin(ix * 127.1 + iy * 311.7 + seed * 74.7) * 43758.5453; return h - Math.floor(h); };

tex[1] = pixTex((x, y) => { // clipped hedge
  const n = vnoise(x, y, 8, 1) * 0.6 + vnoise(x, y, 16, 2) * 0.4, r = rand();
  if (y >= 60) return [62 + r * 10, 46 + r * 8, 30];
  if (n < 0.3 && r < 0.6) return [16, 38, 16];

tex[2] = pixTex((x, y) => { // tree line: canopy over trunks and undergrowth
  const r = rand();
  if (y < 36 + vnoise(x, 0, 8, 3) * 12) {
    const n = vnoise(x, y, 8, 4) * 0.6 + vnoise(x, y, 16, 5) * 0.4, v = n * 80 + r * 20;
    if (n < 0.3 && r < 0.5) return [14, 34, 18];

    return [20 + v * 0.4, 52 + v * 0.9, 24 + v * 0.3];

    const bark = (y * 3 + t * 7) % 9 < 2 ? -18 : 0, sh = t === 7 ? -20 : t === 13 ? -25 : t === 9 ? 15 : 0;
    return [92 + bark + sh + r * 10, 66 + bark + sh + r * 8, 44 + bark + sh];

tex[3] = pixTex((x, y) => { // old stone park wall with ivy
  const row = y >> 4, off = (row & 1) * 16, bx = (x + off) % 32, by = y % 16, r = rand();
  const ivy = vnoise(x, y, 8, 7) * 0.7 + vnoise(x, y, 4, 8) * 0.3 - y / 150;

  if (by === 0 || bx === 0) return [168 + r * 20, 160 + r * 20, 148 + r * 18];

  const c = mkCanvas(TEX, TEX), g = c.getContext('2d');
  g.drawImage(tex[1], 0, 0); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = '#7a7a72'; g.fillRect(0, 0, 6, 64); g.fillRect(58, 0, 6, 64);
  g.fillStyle = '#9a9a90'; g.fillRect(0, 0, 6, 3); g.fillRect(58, 0, 6, 3);

  for (let x = 9; x < 57; x += 6) g.fillRect(x, 10, 2, 54);

  g.fillStyle = '#1c0000'; g.fillRect(15, 14, 34, 12); g.strokeStyle = '#e8b81a'; g.strokeRect(15.5, 14.5, 33, 11);
  g.fillStyle = '#ff3b2f'; g.font = 'bold 10px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('EXIT', 32, 20.5);

/* floor textures (raw pixels for the floor caster) */

/* ---------------- Update ---------------- */

function isPaused() { return state === 'play' && !touchMode && !noLock && !locked; }

function drawSprite(s) {
  const { im, tX, tY, size, z } = s;
  const scr = (W / 2) * (1 + tX / tY);
  const h = projDist * size / tY, w = h * im.width / im.height;
  const bottom = HORIZON + projDist * (0.5 - z) / tY, top = bottom - h, left = scr - w / 2;
  const x0 = Math.max(0, Math.floor(left)), x1 = Math.min(W, Math.ceil(left + w));
  if (x1 <= x0) return;

  const src = shaded(im, lvl);
  for (let x = x0; x < x1; x++) {
    if (tY >= zbuf[x]) continue;
    const tx = Math.floor((x + 0.5 - left) / w * im.width);
    if (tx < 0 || tx >= im.width) continue;
    ctx.drawImage(src, tx, 0, 1, im.height, x, top, 1, h);
  }
}

  octx.globalAlpha = 0.45; octx.fillStyle = '#e8d7b8'; octx.beginPath(); octx.arc(mb.x, mb.y, mb.r, 0, 6.283); octx.fill();
  octx.globalAlpha = 0.95; octx.fillStyle = '#2b1a0c'; octx.font = `8px ${FONT}`; octx.fillText('MAP', mb.x, mb.y + 1);
  octx.globalAlpha = 1;
}

/* ---------------- Layout ---------------- */
function resize() {
  const iw = window.innerWidth, ih = window.innerHeight;
  W = clamp(Math.round(H * iw / ih), 280, 420);
  cv.width = W; cv.height = H; ctx.imageSmoothingEnabled = false;
  const s = Math.min(iw / W, ih / H), cw = W * s, ch = H * s;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = (iw - cw) / 2 + 'px';
  cv.style.top = (ih > iw ? Math.max(0, (ih - ch) * 0.08) : (ih - ch) / 2) + 'px';
  projDist = W / 2 / PLANE; zbuf = new Float32Array(W);
  floorBuf = ctx.createImageData(W, VIEW_H - HORIZON); floor32 = new Uint32Array(floorBuf.data.buffer);
  ceilGrad = ctx.createLinearGradient(0, 0, 0, HORIZON);
  ceilGrad.addColorStop(0, '#16110d'); ceilGrad.addColorStop(1, '#3a2f26');
  floorGrad = ctx.createLinearGradient(0, HORIZON, 0, VIEW_H);
  floorGrad.addColorStop(0, '#1a140f'); floorGrad.addColorStop(1, '#55432f');
  const dpr = window.devicePixelRatio || 1;
  const vh = ch * VIEW_H / H;
  hv.style.left = cv.style.left; hv.style.top = cv.style.top; hv.style.width = cw + 'px'; hv.style.height = vh + 'px';
  hv.width = Math.round(cw * dpr); hv.height = Math.round(vh * dpr);
  ov.width = Math.round(iw * dpr); ov.height = Math.round(ih * dpr);
}
window.addEventListener('resize', resize);

/* ---------------- Main loop ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  render();
  drawHands();
  drawCompass();
  drawTouch();
  requestAnimationFrame(frame);
}
resize();
genLevel(1); // attract-mode backdrop for the title screen
refreshBoard();
if (document.fonts && document.fonts.load) document.fonts.load(`8px ${FONT}`).catch(() => {});
requestAnimationFrame(frame);

// debug hook for automated testing only
window.__quack = { get state() { return state; }, P, get ducks() { return ducks; }, get items() { return items; },
  start() { newGame(); state = 'play'; stateT = 0; noLock = true; }, startLevel, renderMusic, get music() { return { on: music.on, playing: music.playing }; }, guidePoint, get input() { return { noLock, locked, everLocked, fireHeld, touchMode }; }, get map() { return { map, mw, mh, fl, props }; }, get lb() { return { score, hiscores, entry, state }; }, setScore(v) { score = v; }, kill() { hurtPlayer(9999); } };
})();
